version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20.19.0
        - nvm use 20.19.0
        - npm ci --cache .npm --prefer-offline
        - node scripts/configure-auth.mjs
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/shimmer-server-ui/browser
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
